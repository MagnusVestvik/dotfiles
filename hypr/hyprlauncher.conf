general {
    grab_focus = true
}

cache {
    enabled = true
}

finders {
    default_finder = desktop

    # Finder prefixes
    desktop_prefix =
    unicode_prefix = .
    math_prefix = =
    font_prefix = '

    # Good if you use uwsm; otherwise leave empty
    # desktop_launch_prefix = uwsm app --

    desktop_icons = true
}

ui {
    # Slightly wider, Spotlight-like
    window_size = 520 360
}
